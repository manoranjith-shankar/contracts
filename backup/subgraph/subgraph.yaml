specVersion: 0.0.4
description: Estate Protocol contract indexer
repository: https://github.com/Estate-Protocol-Home/contracts
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ERC20DividendCheckpointFactory
    network: arbitrum-one
    source:
      address: '0xc2423aAa4f9f342456BE4718a17A0DC973F39eEE'
      abi: ERC20DividendCheckpointFactory
      startBlock: 172075038
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./mappings/factory.ts
      entities:
        - ERC20DividendCheckpointFactory
      abis:
        - name: ERC20DividendCheckpointFactory
          file: ../../build/contracts/ERC20DividendCheckpointFactory.json
      eventHandlers:
        - event: GenerateModuleFromFactory(address,indexed bytes32,indexed address,address,uint256,uint256)
          handler: handleGenerateModuleFromERC20DividendCheckpointFactory

  - kind: ethereum/contract
    name: STFactory
    network: arbitrum-one
    source:
      address: '0x37Ddf5D84337bc0Fab7e807AC6B44eEe27446610'
      abi: STFactory
      startBlock: 172075109
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./mappings/st-factory.ts
      entities:
        - LogicContractSet
        - STFactoryTokenUpgraded
        - DefaultTransferManagerUpdated
        - DefaultDataStoreUpdated
        - STFactoryOwnershipTransferred
        - LogicContractSet1
      abis:
        - name: STFactory
          file: ./abis/STFactory.json
      eventHandlers:
        - event: LogicContractSet(string,uint256,address,bytes,bytes)
          handler: handleLogicContractSet
        - event: DefaultTransferManagerUpdated(indexed address,indexed address)
          handler: handleDefaultTransferManagerUpdated
        - event: DefaultDataStoreUpdated(indexed address,indexed address)
          handler: handleDefaultDataStoreUpdated
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: LogicContractSet(string,address,bytes)
          handler: handleLogicContractSet1

templates:
  - name: ERC20DividendCheckpoint
    kind: ethereum/contract
    network: arbitrum-one
    source:
      abi: ERC20DividendCheckpoint
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./mappings/erc20DividendCheckpoint.ts
      entities:
        - ERC20DividendCheckpoint
      abis:
        - name: ERC20DividendCheckpoint
          file: ../../build/contracts/ERC20DividendCheckpoint.json
      eventHandlers:
        - event: ERC20DividendDeposited(indexed address,uint256,uint256,uint256,indexed address,uint256,uint256,uint256,indexed bytes32)
          handler: handleDividendCreation

  - name: SecurityToken
    kind: ethereum/contract
    network: arbitrum-one
    source:
      abi: SecurityToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./mappings/security-token.ts
      entities:
        - ModuleAdded
        - ModuleUpgraded
        - UpdateTokenDetails
        - UpdateTokenName
        - GranularityChanged
        - FreezeIssuance
        - FreezeTransfers
        - CheckpointCreated
        - SetController
        - TreasuryWalletChanged
        - DisableController
        - OwnershipTransferred
        - TokenUpgraded
        - ModuleArchived
        - ModuleUnarchived
        - ModuleRemoved
        - ModuleBudgetChanged
        - TransferByPartition
        - AuthorizedOperator
        - RevokedOperator
        - AuthorizedOperatorByPartition
        - RevokedOperatorByPartition
        - IssuedByPartition
        - RedeemedByPartition
        - ControllerTransfer
        - ControllerRedemption
        - DocumentRemoved
        - DocumentUpdated
        - Issued
        - Redeemed
        - Transfer
        - Approval
      abis:
        - name: SecurityToken
          file: ./abis/SecurityToken.json
      eventHandlers:
        - event: ModuleAdded(uint8[],indexed bytes32,indexed
            address,address,uint256,uint256,bytes32,bool)
          handler: handleModuleAdded
        - event: ModuleUpgraded(uint8[],address)
          handler: handleModuleUpgraded
        - event: UpdateTokenDetails(string,string)
          handler: handleUpdateTokenDetails
        - event: UpdateTokenName(string,string)
          handler: handleUpdateTokenName
        - event: GranularityChanged(uint256,uint256)
          handler: handleGranularityChanged
        - event: FreezeIssuance()
          handler: handleFreezeIssuance
        - event: FreezeTransfers(bool)
          handler: handleFreezeTransfers
        - event: CheckpointCreated(indexed uint256,uint256)
          handler: handleCheckpointCreated
        - event: SetController(indexed address,indexed address)
          handler: handleSetController
        - event: TreasuryWalletChanged(address,address)
          handler: handleTreasuryWalletChanged
        - event: DisableController()
          handler: handleDisableController
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: TokenUpgraded(uint8,uint8,uint8)
          handler: handleTokenUpgraded
        - event: ModuleArchived(uint8[],address)
          handler: handleModuleArchived
        - event: ModuleUnarchived(uint8[],address)
          handler: handleModuleUnarchived
        - event: ModuleRemoved(uint8[],address)
          handler: handleModuleRemoved
        - event: ModuleBudgetChanged(uint8[],address,uint256,uint256)
          handler: handleModuleBudgetChanged
        - event: TransferByPartition(indexed bytes32,address,indexed address,indexed
            address,uint256,bytes,bytes)
          handler: handleTransferByPartition
        - event: AuthorizedOperator(indexed address,indexed address)
          handler: handleAuthorizedOperator
        - event: RevokedOperator(indexed address,indexed address)
          handler: handleRevokedOperator
        - event: AuthorizedOperatorByPartition(indexed bytes32,indexed address,indexed address)
          handler: handleAuthorizedOperatorByPartition
        - event: RevokedOperatorByPartition(indexed bytes32,indexed address,indexed address)
          handler: handleRevokedOperatorByPartition
        - event: IssuedByPartition(indexed bytes32,indexed address,uint256,bytes)
          handler: handleIssuedByPartition
        - event: RedeemedByPartition(indexed bytes32,indexed address,indexed
            address,uint256,bytes,bytes)
          handler: handleRedeemedByPartition
        - event: ControllerTransfer(address,indexed address,indexed address,uint256,bytes,bytes)
          handler: handleControllerTransfer
        - event: ControllerRedemption(address,indexed address,uint256,bytes,bytes)
          handler: handleControllerRedemption
        - event: DocumentRemoved(indexed bytes32,string,bytes32)
          handler: handleDocumentRemoved
        - event: DocumentUpdated(indexed bytes32,string,bytes32)
          handler: handleDocumentUpdated
        - event: Issued(indexed address,indexed address,uint256,bytes)
          handler: handleIssued
        - event: Redeemed(indexed address,indexed address,uint256,bytes)
          handler: handleRedeemed
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval


