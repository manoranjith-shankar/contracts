specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: STFactory
    network: arbitrum-sepolia
    source:
      address: "0x1D20086F5298D8a4c005B02a91124cb05270fEdf"
      abi: STFactory
      startBlock: 733557
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - TokenDeployment
        - InternalTransaction
      abis:
        - name: STFactory
          file: ./abis/STFactory.json
      callHandlers:
        - function: deployToken(string,string,uint8,string,address,bool,address)
          handler: handleDeployToken
      file: ./src/st-factory.ts

  - kind: ethereum/contract
    name: ERC20DividendCheckpointFactory
    network: arbitrum-sepolia
    source:
      address: '0xEEEF9695F9030694b02d325d651468e991De7972'
      abi: ERC20DividendCheckpointFactory
      startBlock: 733549
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities:
        - ERC20DividendCheckpointFactory
      abis:
        - name: ERC20DividendCheckpointFactory
          file: ../build/contracts/ERC20DividendCheckpointFactory.json
      eventHandlers:
        - event: GenerateModuleFromFactory(address,indexed bytes32,indexed address,address,uint256,uint256)
          handler: handleGenerateModuleFromERC20DividendCheckpointFactory

templates:
  - name: SecurityToken
    kind: ethereum/contract
    network: arbitrum-sepolia
    source:
      abi: SecurityToken
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/security-token.ts
      entities:
        - SecurityToken
        - UserCheckpointBalance
      abis:
        - name: SecurityToken
          file: ../build/contracts/SecurityToken.json
        - name: STGetter
          file: ../build/contracts/STGetter.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      callHandlers:
        - function: balanceOfAt(address, unint256)
          handler: handleBalanceOfAt

  - name: ERC20DividendCheckpoint
    kind: ethereum/contract
    network: arbitrum-sepolia
    source:
      abi: ERC20DividendCheckpoint
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/erc20DividendCheckpoint.ts
      entities:
        - ERC20DividendCheckpoint
      abis:
        - name: ERC20DividendCheckpoint
          file: ../build/contracts/ERC20DividendCheckpoint.json
      eventHandlers:
        - event: ERC20DividendDeposited(indexed address,uint256,uint256,uint256,indexed address,uint256,uint256,uint256,indexed bytes32)
          handler: handleDividendCreation