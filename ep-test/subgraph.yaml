specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ERC20DividendCheckpointFactory
    network: arbitrum-one
    source:
      address: "0xc2423aAa4f9f342456BE4718a17A0DC973F39eEE"
      abi: ERC20DividendCheckpointFactory
      startBlock: 172075038
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LogicContractSet
        - ModuleUpgraded
        - OwnershipTransferred
        - ChangeSetupCost
        - ChangeCostType
        - GenerateModuleFromFactory
        - ChangeSTVersionBound
      abis:
        - name: ERC20DividendCheckpointFactory
          file: ./abis/ERC20DividendCheckpointFactory.json
      eventHandlers:
        - event: LogicContractSet(string,uint256,address,bytes)
          handler: handleLogicContractSet
        - event: ModuleUpgraded(indexed address,indexed address,indexed uint256)
          handler: handleModuleUpgraded
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: ChangeSetupCost(uint256,uint256)
          handler: handleChangeSetupCost
        - event: ChangeCostType(bool,bool)
          handler: handleChangeCostType
        - event: GenerateModuleFromFactory(address,indexed bytes32,indexed address,address,uint256,uint256)
          handler: handleGenerateModuleFromFactory
        - event: ChangeSTVersionBound(string,uint8,uint8,uint8)
          handler: handleChangeSTVersionBound
      file: ./src/erc-20-dividend-checkpoint-factory.ts
